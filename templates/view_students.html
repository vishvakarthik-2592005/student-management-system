<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>View Students</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Registered Students</h1>

    <div class="card wide">
        <!-- Search Bar -->
        <form action="/students" method="GET" style="box-shadow: none; padding: 0; width: 100%; margin-bottom: 20px; background: transparent;">
            <div style="display: flex; gap: 10px;">
                <input 
                    type="text" 
                    name="search" 
                    placeholder="Search by name, department, or email..." 
                    value="{{ search_query }}"
                    style="margin: 0; flex: 1;"
                >
                <button type="submit" style="width: auto; margin: 0; padding: 10px 20px;">Search</button>
                {% if search_query %}
                    <a href="/students" style="padding: 10px 15px; background: #6c757d; color: white; text-decoration: none; border-radius: 5px; font-size: 14px; display: inline-block;">Clear</a>
                {% endif %}
            </div>
        </form>

        <table border="1">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Age</th>
                    <th>Department</th>
                    <th>Email</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for student in students %}
                <tr>
                    <td>{{ student[0] }}</td>
                    <td>{{ student[1] }}</td>
                    <td>{{ student[2] }}</td>
                    <td>{{ student[3] }}</td>
                    <td>{{ student[4] }}</td>
                    <td>
                        <a href="/edit/{{ student[0] }}">Edit</a> | 
                        <a href="/delete/{{ student[0] }}" onclick="return confirm('Are you sure you want to delete {{ student[1] }}?')">Delete</a>
                    </td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="6" style="text-align: center;">No students found.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>

        <br>
        <a href="/">← Add Another Student</a>
    </div>
</body>
</html>
